# ============================================================================
# ICX STUDIOS PLATFORM — SELF-HOSTED NGINX REVERSE PROXY CONFIGURATION
# Enforces TLS 1.3 (NF-05), Unbuffered TUS Streaming (PE-02/NF-12),
# and Zero Direct Access to Private Storage (NF-01).
# ============================================================================

limit_req_zone $binary_remote_addr zone=icx_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=icx_auth_limit:10m rate=5r/s;

upstream icx_web_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream icx_api_upstream {
    server 127.0.0.1:4000;
    keepalive 64;
}

server {
    listen 80;
    server_name icxstudios.com www.icxstudios.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name icxstudios.com www.icxstudios.com;

    # TLS 1.2 / 1.3 Enforcement (NF-05)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # STRICT ISOLATION (NF-01): Block any attempt to access private storage paths directly
    location ~* ^/storage/ {
        deny all;
        return 403;
    }

    # TUS v1.0.0 Resumable Upload Endpoint (50MB per chunk/file, unbuffered streaming)
    location /api/v1/uploads/tus {
        client_max_body_size 60M;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://icx_api_upstream;
    }

    # Authentication Endpoints (Rate Limited NF-06)
    location /api/v1/auth {
        limit_req zone=icx_auth_limit burst=10 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://icx_api_upstream;
    }

    # Core Node.js API & Authenticated File Streaming Reverse Proxy
    location /api/v1 {
        limit_req zone=icx_api_limit burst=40 nodelay;
        client_max_body_size 60M;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://icx_api_upstream;
    }

    # Next.js Web Application
    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://icx_web_upstream;
    }
}

